<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
  <style>
    .scan-beam {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      animation: rack-scan 3.2s linear infinite;
    }
    .exception-ping {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      animation: rack-ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
    }
    @keyframes rack-scan {
      0% {
        transform: translateX(-40px);
      }
      100% {
        transform: translateX(380px);
      }
    }
    @keyframes rack-ping {
      0% {
        transform: scale(1);
        opacity: 0.7;
      }
      75%,
      100% {
        transform: scale(1.6);
        opacity: 0;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .scan-beam,
      .exception-ping {
        animation: none;
      }
    }
  </style>

